<html lang="en"><head><meta charset="utf-8">

<title>SEI_AFRIQUE Client Book</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f1f8f8;--sf:#fff;--tx:#10262b;--mu:#5d7479;--ac:#0f766e;--on:#fff;--gd:#b8921a;--bd:#d3e3e3;--ok:#2e7d32;--wr:#c62828;--bl:#1565c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1c;--sf:#142629;--tx:#e6f2f2;--mu:#8fb0b3;--ac:#2dd4bf;--on:#062b27;--gd:#e6c04a;--bd:#25403f;--ok:#6fcf74;--wr:#ff7b72;--bl:#6fb1ff}}
:root[data-theme="dark"]{--bg:#0c1a1c;--sf:#142629;--tx:#e6f2f2;--mu:#8fb0b3;--ac:#2dd4bf;--on:#062b27;--gd:#e6c04a;--bd:#25403f;--ok:#6fcf74;--wr:#ff7b72;--bl:#6fb1ff}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font:700 20px Georgia,serif;margin:0;color:var(--ac)}.sub{color:var(--mu);font-size:12px}
button,.b{display:inline-block;text-align:center;background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font:600 14px inherit;cursor:pointer}
.g{background:transparent;color:var(--tx)!important;border:1px solid var(--bd)}.r{background:var(--wr);color:#fff}.logo{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;font:700 16px Georgia,serif;border:2px solid var(--gd)}.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.mr{display:grid;grid-template-columns:64px repeat(5,1fr);gap:4px;margin:4px 0;align-items:center}.mr input{padding:8px 2px;text-align:center;min-width:0}.mr span{font-weight:600;font-size:13px}#lock{padding:12px;max-width:420px;margin:8vh auto}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:16px inherit}
textarea{min-height:70px}label{font-size:12px;color:var(--mu);display:block;margin:8px 0 2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.n{flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chips button{flex:none;padding:6px 12px}
.ck{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--tx);font-size:15px}.ck input{width:22px;height:22px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th div{position:relative}.th img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.th i{position:absolute;top:-6px;right:-6px;background:var(--wr);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
#bar{background:var(--ac);color:#fff;padding:8px 12px;font-size:13px;display:none}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}#big img{max-width:96%;max-height:96%}
.hide{display:none!important}.mu{color:var(--mu);font-size:13px}
@media print{button,.chips,#bar,.nop{display:none!important}}
.lg{height:46px;width:auto;border-radius:8px;background:#000;flex:none}.ub{position:relative;overflow:hidden;display:block;flex:1}.ub .b{display:block;margin:0;font-size:14px}.ub input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:300px}</style></head><body>

async function auth(m){const v=id=>(($('#'+id)||{}).value||''),a=A(),e=t=>{$('#err').textContent=t},pw=v('p1');
 if(m=='login')return a&&await H2(pw)==a.p?unlock():e('Wrong password.');
 if(m=='change'&&(!a||await H2(v('op'))!=a.p))return e('Current password is wrong.');
 if(m=='reset'&&(!a||await H2(v('kw').trim().toLowerCase())!=a.k))return e('Security keyword is not correct.');
 if(m=='setup'&&!v('kw').trim())return e('Please enter a security keyword.');
 if(pw.length<6)return e('Password must be at least 6 characters.');
 if(pw!=v('p2'))return e('Passwords do not match.');
 const n=a||{};n.p=await H2(pw);if(v('kw').trim()&&m!='reset')n.k=await H2(v('kw').trim().toLowerCase());if(m=='setup')n.hint=v('hint');
 ls.s('sei_auth',JSON.stringify(n));unlock()}

 let a=L.filter(c=>(!q||JSON.stringify([c.cid,c.name,c.phone,c.address,c.fabric,c.style,c.notes]).toLowerCase().includes(q))&&(F=='All'||(F=='Due soon'?(!c.delivered&&c.date&&days(c.date)<=3):stat(c)==F)));
 a.sort((x,y)=>(x.date||'9').localeCompare(y.date||'9'));
 $('#tot').textContent=L.length;$('#ip').textContent=L.filter(c=>stat(c)=='In progress').length;$('#ds').textContent=L.filter(c=>!c.delivered&&c.date&&days(c.date)<=3).length;$('#stat').textContent=`Showing ${a.length} of ${L.length} clients`+(db?'':' · storage unavailable: data will be lost on close, use backup');
 $('#list').innerHTML=a.map(c=>{const d=days(c.date),s=stat(c),late=!c.delivered&&d!==null&&d<0;
